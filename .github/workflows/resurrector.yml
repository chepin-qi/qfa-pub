name: qfa-engine-resurrector
# 律六:workflow_run 事件挽火(零cron)。判定逻辑在 ci/resurrect.sh(一败一挽/连败告警即眠/cancelled不挽)。
on:
  workflow_run:
    workflows: ["qfa-engine-self-cascade"]
    types: [completed]
permissions:
  actions: write
jobs:
  resurrect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard + maybe re-dispatch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash ci/resurrect.sh "${{ github.event.workflow_run.conclusion }}" "${{ github.event.workflow_run.id }}"
