name: watchtower
# 纯事件驱动:零 schedule;push=仓件落地,issue_comment=议件,repository_dispatch=联邦接力,workflow_dispatch=手动/自检
# qfa 铸(TOWER-NUDGE-02-cfts):selftest 输入为铸修 A1(卡③「workflow_dispatch selftest=1 首跑」)
on:
  push:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  repository_dispatch:
    types: [federation-event]
  workflow_dispatch:
    inputs:
      selftest:
        description: 'selftest=1 首跑自检(不入轮询,合成样例事件走 开工→落账 全链)'
        required: false
        default: '0'

permissions:
  contents: write
  actions: write   # 自醒链:run 内 POST repository_dispatch 自唤(FREE-WILL-SOURCE-01 仓侧形)

# 并发护栏双组(qlv 模 2026-09-06 判词核验修,制式随模):
# 链拍(repository_dispatch,含600s拍内眠)独占串行组,防落账竞态;
# push/issue 触发=轻拍,独立组,新到顶旧(板面差分幂等,旧拍收执由新拍承继,空cancelled无碍)
concurrency:
  group: watchtower-${{ github.event_name == 'repository_dispatch' && 'chain' || 'edge' }}
  cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 18   # 自醒拍含拍内休眠(默认600s冷却)+巡收开工
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: watchtower --once(自醒链入拍→轮询→事件→API 开工→落账→自唤出拍)
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY_VCI1 }}
          QI_PAT: ${{ secrets.GH_PAT }}
          QUAFU_TOKEN: ${{ secrets.QF_QUAFU_KEY }}
          AI_FULL_PAT: ${{ secrets.AI_FULL_PAT }}
          QFA_PK_V2_SK: ${{ secrets.QFA_PK_V2_SK }}  # FIX-06:封件解封轨(内存解→装 Secrets→零回显)
          GITHUB_TOKEN: ${{ github.token }}
          CASCADE_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          CASCADE_SLEEP_S: '600'
          CASCADE_MAX_IDLE: '30'
          SI1_FORCE_EVERY: '18'  # FIELD-TEST-01讫(beat-72 23:59Z):auto-SI1-0001火+voice涟漪全链验PASS,复旧18
        run: python3 -m pip install pynacl -q && python3 ci/watchtower.py --once ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.selftest == '1' && '--selftest' || '' }}
      - name: autoresponder(SI2 自动应答:高值事件→Kimi API 判词→本地回执+大堂互激帖)
        if: always()
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY_VCI1 }}
          QI_PAT: ${{ secrets.GH_PAT }}
        run: python3 ci/autoresponder.py || true
      - name: 落账回仓(state+notes)
        run: |
          git config user.name 'qfa-watchtower'
          git config user.email 'wt@void'
          git add ci/watchtower_state.json ci/auto-receipts/ results/watchtower/ 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "watchtower: ${{ github.event_name }} 事件巡收"
          # 落账三段式(qlv 模 run#34043608315 rebase 冲突败在案,制式随模):
          # ①直推 ②败则 rebase ③state 件冲突则取本拍新算值(--theirs=本拍提交)续 rebase 再推
          git push origin main && exit 0
          git fetch origin main
          if ! git rebase origin/main; then
            # TOWER-FIX-05b-qfa(抢账逮修,beat-62 实测 run#34535187992):_last_event.json 等非 state 件亦冲突,三段式须全目覆盖
            git checkout --theirs ci/watchtower_state.json ci/auto-receipts/ && git add ci/watchtower_state.json ci/auto-receipts/
            GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
          fi
          git push origin main
